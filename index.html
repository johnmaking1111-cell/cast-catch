<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배우 오디션 포털 | CastCatch</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 pb-28 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Top App Bar -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <span class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-sm shadow-indigo-200">🎭</span>
        <div>
          <h1 class="text-base font-bold tracking-tight text-slate-900 leading-none">CastCatch</h1>
          <span class="text-[10px] font-semibold text-indigo-600">대한민국 배우 오디션 올인원 포털</span>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="shareApp()" class="p-2 text-slate-500 hover:text-indigo-600 transition" title="공유하기">
          <i data-lucide="share-2" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-md mx-auto px-4 pt-3 space-y-4">

    <!-- Notice Banner -->
    <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 text-white rounded-2xl p-4 shadow-md shadow-indigo-100 relative overflow-hidden">
      <div class="relative z-10">
        <div class="inline-flex items-center space-x-1 bg-white/20 px-2 py-0.5 rounded-full text-[10px] font-semibold mb-1.5 backdrop-blur-sm">
          <span>🔔 실시간 오디션 바로가기 허브</span>
        </div>
        <h2 class="text-sm font-bold leading-snug">대한민국 모든 오디션 공고를<br>한곳에서 원터치로 확인하세요!</h2>
        <p class="text-[11px] text-indigo-100 mt-1">영화 · 드라마 · 연극 · 뮤지컬 · 광고 캐스팅 사이트 총집합</p>
      </div>
      <div class="absolute -right-3 -bottom-4 text-white/10 text-7xl font-extrabold select-none">
        ACT
      </div>
    </div>

    <!-- Quick Search -->
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
      <input type="text" id="searchInput" oninput="filterSites()" placeholder="오디션 사이트 이름, 장르 검색..." 
        class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent shadow-sm">
    </div>

    <!-- Category Tabs -->
    <div class="flex space-x-2 overflow-x-auto hide-scrollbar py-1">
      <button onclick="selectCategory('전체')" class="cat-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-indigo-600 text-white shadow-sm transition">전체 (12)</button>
      <button onclick="selectCategory('영화/드라마')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">🎬 영화 · 드라마</button>
      <button onclick="selectCategory('연극/뮤지컬')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">🎭 연극 · 뮤지컬</button>
      <button onclick="selectCategory('광고/모델')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">📸 광고 · 모델</button>
      <button onclick="selectCategory('공공/기관')" class="cat-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">🏛️ 국공립 · 기관</button>
    </div>

    <!-- Site Cards Feed -->
    <div id="siteList" class="space-y-2.5">
      <!-- Cards rendered via JS -->
    </div>

    <!-- 🌟 Studio Johnmaking Branding Section 🌟 -->
    <section class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white rounded-3xl p-5 shadow-lg space-y-3.5 mt-6 border border-slate-700/50">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="w-7 h-7 rounded-lg bg-amber-400 text-slate-900 flex items-center justify-center font-bold text-sm shadow">📸</span>
          <h3 class="font-bold text-sm tracking-tight text-white">스튜디오 존메이킹 (Johnmaking)</h3>
        </div>
        <span class="text-[10px] font-semibold bg-white/10 text-amber-300 px-2 py-0.5 rounded-full border border-amber-400/30">배우 프로필 전문</span>
      </div>

      <p class="text-xs text-slate-300 leading-relaxed">
        캐스팅 디렉터의 시선을 사로잡는 <span class="text-amber-300 font-semibold">배우 프로필 사진 & 영상 포트폴리오</span> 맞춤 촬영을 진행합니다.
      </p>

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        <!-- Kakao Open Chat -->
        <a href="https://pf.kakao.com/_xcfxkxnd/chat" target="_blank" rel="noopener noreferrer" 
          class="flex items-center justify-center space-x-1.5 bg-[#FEE500] hover:bg-[#FADA0A] text-[#191919] font-bold text-xs py-3 rounded-2xl shadow-sm transition active:scale-98">
          <i data-lucide="message-circle" class="w-4 h-4"></i>
          <span>카톡 상담하기</span>
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/studio_johnmaking?igsh=ZnR2NHV5ZWg3N2k1" target="_blank" rel="noopener noreferrer" 
          class="flex items-center justify-center space-x-1.5 bg-gradient-to-r from-[#833ab4] via-[#fd1d1d] to-[#fcb045] hover:opacity-90 text-white font-bold text-xs py-3 rounded-2xl shadow-sm transition active:scale-98">
          <i data-lucide="instagram" class="w-4 h-4"></i>
          <span>인스타그램 보기</span>
        </a>
      </div>
      <p class="text-[10px] text-center text-slate-400 pt-1">촬영 문의 및 포트폴리오 확인은 위 링크를 이용해 주세요.</p>
    </section>

  </main>

  <script>
    const SITES = [
      {
        id: 1,
        name: "필름메이커스 (Filmmakers)",
        category: "영화/드라마",
        badge: "국내 1위 영화 포털",
        description: "상업영화, 독립/단편영화, OTT 시리즈, 웹드라마 배우 모집 게시판",
        url: "https://www.filmmakers.co.kr/actorsAudition",
        tag: "영화 · 드라마",
        iconColor: "bg-amber-500"
      },
      {
        id: 2,
        name: "OTR (우리들의 연극세계)",
        category: "연극/뮤지컬",
        badge: "대학로 1위 공연 포털",
        description: "전국 연극, 창작극, 소극장/대극장 뮤지컬, 극단 신입 단원 모집 공고",
        url: "https://otr.co.kr/audition/",
        tag: "연극 · 뮤지컬",
        iconColor: "bg-rose-500"
      },
      {
        id: 3,
        name: "플필 (Plfil)",
        category: "영화/드라마",
        badge: "온라인 캐스팅 플랫폼",
        description: "제작사 공식 캐스팅 공고, 오디션 지원, 프로필 투어 접수",
        url: "https://plfil.com/",
        tag: "캐스팅 · 프로필",
        iconColor: "bg-sky-500"
      },
      {
        id: 4,
        name: "스탈렛 스튜디오 (Starlet Studio)",
        category: "영화/드라마",
        badge: "상업영화/KAFA 공고",
        description: "장편 상업영화 조·단역, 한국영화아카데미(KAFA), OTT 드라마 캐스팅",
        url: "https://www.starlet-studio.co.kr/audition",
        tag: "상업영화 · OTT",
        iconColor: "bg-indigo-500"
      },
      {
        id: 5,
        name: "플레이DB (PlayDB)",
        category: "연극/뮤지컬",
        badge: "인터파크 공식 공연 포털",
        description: "대극장 라이선스 뮤지컬, 국공립 정통 연극 전 배역 및 앙상블 오디션",
        url: "http://www.playdb.co.kr/community/Publicity_list.asp?bbsno=29",
        tag: "대극장 뮤지컬",
        iconColor: "bg-purple-500"
      },
      {
        id: 6,
        name: "메가폰코리아 (Megaphone Korea)",
        category: "영화/드라마",
        badge: "메이저 캐스팅 포털",
        description: "방송사, 제작사, 기획사 연합 오디션 및 영상 프로젝트 캐스팅",
        url: "http://www.megaphonekorea.com/audition/variety",
        tag: "공식 오디션",
        iconColor: "bg-blue-500"
      },
      {
        id: 7,
        name: "더뮤지컬 (The Musical)",
        category: "연극/뮤지컬",
        badge: "뮤지컬 전문 매거진",
        description: "신작 뮤지컬, 대형 제작사 공식 오디션 공고 및 캐스팅 소식",
        url: "https://www.themusical.co.kr/",
        tag: "뮤지컬 매거진",
        iconColor: "bg-pink-500"
      },
      {
        id: 8,
        name: "KOPIS 공연예술통합전산망",
        category: "공공/기관",
        badge: "문체부/예술경영지원센터",
        description: "국립극단, 시립뮤지컬단, 전국 문화재단 공공 공연 오디션 및 제작 지원 공모",
        url: "https://kopis.or.kr/por/main/main.do",
        tag: "국공립 · 공공",
        iconColor: "bg-emerald-600"
      },
      {
        id: 9,
        name: "한국영화아카데미 (KAFA)",
        category: "공공/기관",
        badge: "영진위 영화 교육기관",
        description: "KAFA 장편과정 및 정규과정 졸업작품 주·조연 배우 공개 모집",
        url: "https://www.kafa.ac/",
        tag: "영화아카데미",
        iconColor: "bg-teal-600"
      },
      {
        id: 10,
        name: "모델나라 (Model Nara)",
        category: "광고/모델",
        badge: "광고/CF 구인 1위",
        description: "TV CF, 브랜드 바이럴 영상, 패션 룩북, 뷰티/피팅 모델 실시간 섭외",
        url: "https://modelnara.com/",
        tag: "광고 · CF 모델",
        iconColor: "bg-orange-500"
      },
      {
        id: 11,
        name: "캐스틱 (Castik)",
        category: "영화/드라마",
        badge: "숏폼/웹드라마 캐스팅",
        description: "유튜브/숏폼 드라마, 웹시리즈, 독립영화 신인 배우 캐스팅",
        url: "https://castik.co.kr/",
        tag: "숏폼 · 웹드",
        iconColor: "bg-cyan-500"
      },
      {
        id: 12,
        name: "콘테스트코리아 (연기/모델 선발)",
        category: "광고/모델",
        badge: "대회 · 공모전 포털",
        description: "신인 연기자 오디션, 탤런트 선발대회, 모델 콘테스트 정보 모음",
        url: "https://www.contestkorea.com/sub/list.php?int_gbn=1&Txt_bcode=030410001",
        tag: "선발대회",
        iconColor: "bg-yellow-500"
      }
    ];

    let currentCategory = '전체';

    function selectCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.innerText.includes(cat) || (cat === '전체' && btn.innerText.includes('전체'))) {
          btn.className = "cat-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-indigo-600 text-white shadow-sm transition";
        } else {
          btn.className = "cat-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition";
        }
      });
      filterSites();
    }

    function filterSites() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const filtered = SITES.filter(site => {
        if (currentCategory !== '전체' && site.category !== currentCategory) return false;
        if (search) {
          const matchName = site.name.toLowerCase().includes(search);
          const matchDesc = site.description.toLowerCase().includes(search);
          const matchTag = site.tag.toLowerCase().includes(search);
          if (!matchName && !matchDesc && !matchTag) return false;
        }
        return true;
      });
      renderList(filtered);
    }

    function renderList(items) {
      const container = document.getElementById('siteList');
      if (items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-slate-200">
            <p class="text-xs text-slate-400">검색 조건에 맞는 사이트가 없습니다.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = items.map(site => `
        <div class="bg-white border border-slate-200/90 rounded-2xl p-4 shadow-sm hover:shadow-md transition duration-200 flex flex-col justify-between">
          <div class="flex items-start justify-between mb-2">
            <div class="flex items-center space-x-2.5">
              <div class="w-9 h-9 rounded-xl ${site.iconColor} text-white flex items-center justify-center font-bold text-sm shadow-sm shrink-0">
                ${site.name.charAt(0)}
              </div>
              <div>
                <div class="flex items-center space-x-1.5">
                  <h3 class="text-sm font-bold text-slate-900">${site.name}</h3>
                  <span class="text-[10px] font-semibold text-red-500 bg-red-50 px-1.5 py-0.2 rounded border border-red-200/60 animate-pulse">LIVE</span>
                </div>
                <span class="text-[10px] font-medium text-slate-400">${site.badge}</span>
              </div>
            </div>
            <span class="text-[10px] font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-full border border-slate-200 shrink-0">${site.tag}</span>
          </div>

          <p class="text-xs text-slate-600 leading-relaxed mb-3 bg-slate-50 p-2.5 rounded-xl">
            ${site.description}
          </p>

          <a href="${site.url}" target="_blank" rel="noopener noreferrer" 
            class="w-full text-center py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-sm transition flex items-center justify-center space-x-1.5 active:scale-98">
            <span>최신 오디션 공고 확인하러 가기</span>
            <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          </a>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function shareApp() {
      if (navigator.share) {
        navigator.share({
          title: '배우 오디션 올인원 포털 | CastCatch',
          text: '영화, 드라마, 연극, 뮤지컬, 광고 오디션 공식 사이트를 한곳에서 확인하세요!',
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href).then(() => {
          alert('앱 링크가 클립보드에 복사되었습니다.');
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      filterSites();
    });
  </script>
</body>
</html>
