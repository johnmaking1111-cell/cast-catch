name: 오디션 공고 자동 수집

on:
  schedule:
    # 4시간마다 자동 실행
    - cron: '0 */4 * * *'
  workflow_dispatch: # 수동 즉시 실행 지원

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install beautifulsoup4 requests

      - name: 최신 오디션 수집 실행
        run: |
          cd audition_app
          python sync.py

      - name: 변경된 데이터 자동 저장
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add audition_app/auditions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 최신 오디션 자동 업데이트" && git push)
